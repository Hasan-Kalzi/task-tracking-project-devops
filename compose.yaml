services:
  api:
    image: ${TASK_API_IMAGE:-task-api:dev}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      DATABASE_PATH: /data/tasks.db
    volumes:
      - task-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  task-data:
