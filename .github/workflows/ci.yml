name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install dependencies
        run: |
          python -m pip install \
            --require-hashes \
            --only-binary=:all: \
            -r requirements-dev.lock

      - name: Check linting
        run: python -m ruff check app tests scripts

      - name: Check formatting
        run: python -m ruff format --check app tests scripts

      - name: Run tests
        run: python -m pytest -q

      - name: Validate Ansible and Compose configuration
        run: |
          ansible-playbook -i infra/inventory.example.ini infra/provision.yml --syntax-check
          ansible-playbook -i infra/inventory.example.ini infra/deploy.yml --syntax-check -e task_api_version=v0.0.0
          docker compose -f compose.yaml config --quiet

      - name: Build Docker image
        env:
          TASK_API_IMAGE: task-api:ci
        run: |
          docker compose \
            -f compose.yaml \
            -f compose.build.yaml \
            build --pull

      - name: Run Docker integration and persistence tests
        run: python scripts/container_check.py --image task-api:ci --version ci
