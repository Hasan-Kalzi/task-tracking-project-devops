name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install dependencies
        run: |
          python -m pip install \
            --require-hashes \
            --only-binary=:all: \
            -r requirements-dev.lock

      - name: Check linting
        run: python -m ruff check app tests scripts

      - name: Check formatting
        run: python -m ruff format --check app tests scripts

      - name: Run tests
        run: python -m pytest -q

      - name: Build Docker image
        env:
          TASK_API_IMAGE: task-api:ci
        run: |
          docker compose \
            -f compose.yaml \
            -f compose.build.yaml \
            build --pull

      - name: Run Docker integration and persistence tests
        run: python scripts/container_check.py --image task-api:ci --version ci